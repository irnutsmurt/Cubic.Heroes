name: Rendering defect
description: Something looks wrong -- missing or wrong textures, colours, lighting, shadows, effects, flicker, artefacts.
title: "[Rendering] "
labels: ["bug", "rendering"]
body:
  - type: markdown
    attributes:
      value: |
        A screenshot is the most useful thing you can attach -- of our build, and if you can, of the same place in the
        original game or RPCS3. **Never attach game files, keys, save files or personal information.**
  - type: input
    id: version
    attributes:
      label: Cubic.Heroes version
      placeholder: "0.2.0-beta.1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      description: Attach screenshots (ours, and the original's or RPCS3's for comparison if you have them).
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where and when
      description: The area or room, what was on screen (an enemy, a spell, an event), and whether it happens every time.
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display settings
      description: "Display mode, resolution, frame limit, VSync."
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "AMD Radeon RX 6700 XT, Adrenalin 24.10.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and CPU
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Launcher > Diagnostics > Export Logs, review, Save the zip, attach it here.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and the known issues list.
          required: true
        - label: I have not attached game files, keys, save files or personal information.
          required: true
