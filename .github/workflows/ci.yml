# Cubic.Heroes CI (M11.4, docs/M11_4_PLAN.md section 5.4): every push and pull request built and tested on Windows
# and Linux x86-64. No game data, keys, generated game code or signing key is ever here: the runtime compiles against
# a stub lift (tools/ci_stub_lift.py). What CI proves is that both platforms compile, link and pass their unit and
# command-line tests -- not that the game behaves; that is the regression suite's, on a player's own installation.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Boundary and privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The recompilation boundary (every tracked file)
        run: python tools/boundary_check.py tracked
      - name: Forbidden middleware paths and the licence classes
        run: python tools/license_audit.py
      - name: Nothing private in the commits of this push or pull request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          python tools/push_guard.py range "$range"

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
          - os: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python packages; CMake and Ninja
        # CMake 4: OpenAL Soft 1.25.2's build (shipped unmodified) passes add_dependencies an empty list once its
        # HRTF data is dropped (tools/build_deps.py), which CMake 3 refuses; the same CMake and Ninja on both runners
        run: python -m pip install pycryptodome pillow "cmake>=4,<5" "ninja>=1.11"
      - name: System headers (Linux)
        if: matrix.os == 'linux'
        # SDL2's X11/Wayland/audio backends and OpenAL Soft's PipeWire/PulseAudio/ALSA backends are compiled
        # against these headers and loaded at run time (nothing of them is linked)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libdrm-dev libgbm-dev libegl-dev libudev-dev libdbus-1-dev libpulse-dev \
            libpipewire-0.3-dev libasound2-dev
      - name: Cache the third-party sources and Zig
        uses: actions/cache@v5
        with:
          path: |
            build/deps/src
            build/toolchain/zig-x86_64-*-0.17.0
          key: deps-${{ matrix.os }}-${{ hashFiles('config/deps.sha256', 'tools/fetch_zig.py') }}
      - name: Build (Zig, ps3recomp and its patches, libraries, runtime, launcher) and the command line's smoke test
        run: python tools/ci_build.py
      - name: Unit tests
        shell: bash
        run: |
          failed=0
          for f in tests/test_*.py; do
            m="tests.$(basename "$f" .py)"
            echo "== $m"
            python -m unittest "$m" || failed=1
          done
          exit $failed
      - name: Shipped libraries within the glibc baseline (2.31)
        if: matrix.os == 'linux'
        run: python tools/glibc_check.py build/ci/launcher/CubicHeroes build/lib/linux/*.so*
